# Server Port
server.port=8080

# Application Name
spring.application.name=shop-monolith

# Optional Local Config Import (auto-loads application-local.properties if present)
spring.config.import=optional:file:application-local.properties,optional:file:./application-local.properties

# Database Configuration (Supabase PostgreSQL with fallback to H2 for testing)
# Environment variables SUPABASE_DB_URL, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD take precedence.
spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization (Optional)
spring.sql.init.mode=never
